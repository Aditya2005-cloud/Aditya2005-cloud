name: Generate 3D Contribution Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          USERNAME: Aditya2005-cloud

      - name: Commit and push 3D profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          cp -f profile-3d-contrib/profile-night-view.svg assets/contribution-skyline.svg 2>/dev/null || \
          cp -f profile-3d-contrib/*.svg assets/contribution-skyline.svg 2>/dev/null || true
          git add assets/contribution-skyline.svg || true
          git diff --staged --quiet || git commit -m "chore: update 3D contribution profile"
          git push || true
